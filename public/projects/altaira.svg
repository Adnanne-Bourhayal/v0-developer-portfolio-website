<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grad1)"/>
  <!-- Neural network nodes -->
  <circle cx="200" cy="225" r="30" fill="#3b82f6" opacity="0.6"/>
  <circle cx="400" cy="150" r="25" fill="#6366f1" opacity="0.6"/>
  <circle cx="400" cy="300" r="25" fill="#6366f1" opacity="0.6"/>
  <circle cx="600" cy="225" r="30" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="400" cy="225" r="20" fill="#6366f1" opacity="0.6"/>
  <!-- Connecting lines -->
  <line x1="200" y1="225" x2="400" y2="150" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="225" x2="400" y2="225" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="225" x2="400" y2="300" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="150" x2="600" y2="225" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="225" x2="600" y2="225" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="300" x2="600" y2="225" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  <!-- AI spark effect -->
  <circle cx="400" cy="225" r="40" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3"/>
  <circle cx="400" cy="225" r="60" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.2"/>
</svg>
